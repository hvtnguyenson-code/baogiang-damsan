name: Deploy Bao giang VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact verified main commit
        required: true
        type: string
      confirmation:
        description: Explicit production confirmation
        required: true
        type: string
      run_migrations:
        description: Must remain false (code-only deploy)
        default: false
        required: true
        type: boolean
      allow_code_rollback_after_migration:
        description: Must remain false
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Bao giang service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Admit exact successful main CI (code-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          ROLLBACK_AFTER_MIGRATION: ${{ inputs.allow_code_rollback_after_migration }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMATION" == 'DEPLOY-BAOGIANG-PRODUCTION' ]]
          [[ "$RUN_MIGRATIONS" == 'false' && "$ROLLBACK_AFTER_MIGRATION" == 'false' ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" == "$TARGET_SHA" ]] || { echo 'Superseded or unsafe main commit'; exit 1; }
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .head_sha == "'"$TARGET_SHA"'" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length')"
          [[ "$ci" -gt 0 ]] || { echo 'No successful main CI'; exit 1; }
          echo "Admitted isolated code-only SHA: $TARGET_SHA"

      - name: Prepare pinned OpenSSH identity
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]]
          (( PORT >= 1 && PORT <= 65535 ))
          expected="$HOST"
          if [[ "$PORT" != 22 ]]; then expected="[$HOST]:$PORT"; fi
          read -r host type key extra <<< "$HOST_KEY"
          [[ "$host" == "$expected" && -z "${extra:-}" && "$type" == ssh-ed25519 ]]
          umask 077
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/baogiang-known-hosts"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/baogiang-ssh-key"
          chmod 600 "$RUNNER_TEMP/baogiang-known-hosts" "$RUNNER_TEMP/baogiang-ssh-key"
          ssh-keygen -l -E sha256 -f "$RUNNER_TEMP/baogiang-known-hosts" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/baogiang-ssh-key" >/dev/null

      - name: Enqueue exact SHA and reconcile short SSH sessions
        shell: bash
        timeout-minutes: 40
        env:
          TARGET_SHA: \${{ inputs.commit_sha }}
          VPS_HOST: \${{ secrets.PROD_SSH_HOST }}
          VPS_PORT: \${{ secrets.PROD_SSH_PORT }}
          VPS_USER: \${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" == bg_deploy ]]
          keyfile="$RUNNER_TEMP/baogiang-ssh-key"
          knownfile="$RUNNER_TEMP/baogiang-known-hosts"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          # Never keep an SSH session attached to the multi-minute Windows build.
          remote() {
            timeout 35s ssh -n -i "$keyfile" -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$knownfile" \
              "$VPS_USER@$VPS_HOST" \
              powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
              -File 'C:\ProgramData\BaoGiangDeploy\request-deploy.ps1' \
              -ExpectedSha "$TARGET_SHA" "$@"
          }
          # An ambiguous transport failure MUST be retried idempotently,
          # not treated as permission to launch another worker.
          accepted=''
          for attempt in {1..8}; do
            set +e
            response="$(remote -Mode Enqueue 2>&1)"
            rc=$?
            set -e
            clean="$(printf '%s\n' "$response" | sed 's/\r$//')"
            if [[ "$rc" -eq 0 ]] && printf '%s\n' "$clean" | grep -Eq "^BAOGIANG_DEPLOY_ALREADY_CURRENT sha=\${TARGET_SHA}$"; then
              echo "BAOGIANG_DEPLOY_ALREADY_CURRENT sha=$TARGET_SHA"
              exit 0
            fi
            if [[ "$rc" -eq 0 ]]; then
              accepted="$(printf '%s\n' "$clean" | grep -E "^BAOGIANG_DEPLOY_ACCEPTED sha=\${TARGET_SHA} nonce=[0-9a-f]{32}$" | tail -n 1 || true)"
              [[ -n "$accepted" ]] || { echo 'DEPLOY_ENQUEUE_EVIDENCE_INVALID' >&2; exit 1; }
              break
            fi
            # Error 255 (transport) or 124 (local SSH timeout) may be retried.
            if [[ "$rc" -ne 255 && "$rc" -ne 124 ]]; then
              echo "DEPLOY_ENQUEUE_REJECTED code=$rc" >&2
              exit 1
            fi
            echo "DEPLOY_ENQUEUE_TRANSPORT_RETRY attempt=$attempt code=$rc"
            sleep 8
          done
          [[ -n "$accepted" ]] || { echo 'DEPLOY_ENQUEUE_TRANSPORT_EXHAUSTED' >&2; exit 1; }
          nonce="\${accepted##*nonce=}"
          echo "BAOGIANG_DEPLOY_ENQUEUED sha=$TARGET_SHA"
          # Reconnect for each observation. A dead SSH session does not kill
          # the detached SYSTEM worker. Timeout is independent of worker state.
          for attempt in {1..180}; do
            set +e
            response="$(remote -Mode Poll -Nonce "$nonce" 2>&1)"
            rc=$?
            set -e
            clean="$(printf '%s\n' "$response" | sed 's/\r$//')"
            if [[ "$rc" -eq 0 ]]; then
              if printf '%s\n' "$clean" | grep -Eq "^BAOGIANG_DEPLOY_RESULT_VERIFIED sha=\${TARGET_SHA} nonce=\${nonce} neighbor_pid=[0-9]+$"; then
                echo "BAOGIANG_DEPLOY_VERIFIED sha=$TARGET_SHA"
                exit 0
              fi
              if printf '%s\n' "$clean" | grep -Eq "^BAOGIANG_DEPLOY_RESULT_ALREADY_CURRENT sha=\${TARGET_SHA} nonce=\${nonce}$"; then
                echo "BAOGIANG_DEPLOY_ALREADY_CURRENT sha=$TARGET_SHA"
                exit 0
              fi
              if printf '%s\n' "$clean" | grep -Eq "^BAOGIANG_DEPLOY_RESULT_FAILED sha=\${TARGET_SHA} nonce=\${nonce}$"; then
                echo "BAOGIANG_WORKER_FAILED sha=$TARGET_SHA" >&2
                exit 1
              fi
              if ! printf '%s\n' "$clean" | grep -Eq "^BAOGIANG_DEPLOY_(PENDING|RUNNING) sha=\${TARGET_SHA} nonce=\${nonce}$"; then
                echo 'DEPLOY_POLL_EVIDENCE_INVALID' >&2
                exit 1
              fi
            elif [[ "$rc" -eq 255 || "$rc" -eq 124 ]]; then
              echo "DEPLOY_POLL_TRANSPORT_RETRY attempt=$attempt code=$rc"
            else
              echo "DEPLOY_POLL_REJECTED code=$rc" >&2
              exit 1
            fi
            sleep 12
          done
          echo "DEPLOY_RESULT_TIMEOUT sha=$TARGET_SHA" >&2
          exit 1
