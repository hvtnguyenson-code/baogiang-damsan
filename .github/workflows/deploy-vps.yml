name: Deploy Bao giang VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact verified main commit
        required: true
        type: string
      confirmation:
        description: Explicit production confirmation
        required: true
        type: string
      run_migrations:
        description: Must remain false (code-only deploy)
        default: false
        required: true
        type: boolean
      allow_code_rollback_after_migration:
        description: Must remain false
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Bao giang service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Admit exact successful main CI (code-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          ROLLBACK_AFTER_MIGRATION: ${{ inputs.allow_code_rollback_after_migration }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMATION" == 'DEPLOY-BAOGIANG-PRODUCTION' ]]
          [[ "$RUN_MIGRATIONS" == 'false' && "$ROLLBACK_AFTER_MIGRATION" == 'false' ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" == "$TARGET_SHA" ]] || { echo 'Superseded or unsafe main commit'; exit 1; }
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .head_sha == "'"$TARGET_SHA"'" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length')"
          [[ "$ci" -gt 0 ]] || { echo 'No successful main CI'; exit 1; }
          echo "Admitted isolated code-only SHA: $TARGET_SHA"

      - name: Verify pinned VPS host key
        id: host
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]]
          expected="$HOST"
          if [[ "$PORT" != 22 ]]; then expected="[$HOST]:$PORT"; fi
          read -r host type key extra <<< "$HOST_KEY"
          [[ "$host" == "$expected" && -z "${extra:-}" && "$type" == ssh-ed25519 ]]
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/baogiang-host-key"
          fingerprint="$(ssh-keygen -l -E sha256 -f "$RUNNER_TEMP/baogiang-host-key" | awk '{print $2}')"
          [[ "$fingerprint" == SHA256:* ]]
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Deploy exact main commit on isolated VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.PROD_SSH_PORT }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.host.outputs.fingerprint }}
          command_timeout: 40m
          script: |
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\baogiang\shared\auto-deploy-code-only.ps1" -ExpectedSha "${{ inputs.commit_sha }}"
