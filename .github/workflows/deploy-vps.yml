name: Deploy Bao giang VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact verified main commit
        required: true
        type: string
      confirmation:
        description: Explicit production confirmation
        required: true
        type: string
      run_migrations:
        description: Must remain false (code-only deploy)
        default: false
        required: true
        type: boolean
      allow_code_rollback_after_migration:
        description: Must remain false
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Bao giang service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Admit exact successful main CI (code-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          ROLLBACK_AFTER_MIGRATION: ${{ inputs.allow_code_rollback_after_migration }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMATION" == 'DEPLOY-BAOGIANG-PRODUCTION' ]]
          [[ "$RUN_MIGRATIONS" == 'false' && "$ROLLBACK_AFTER_MIGRATION" == 'false' ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" == "$TARGET_SHA" ]] || { echo 'Superseded or unsafe main commit'; exit 1; }
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI" and .head_sha == "'"$TARGET_SHA"'" and .status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length')"
          [[ "$ci" -gt 0 ]] || { echo 'No successful main CI'; exit 1; }
          echo "Admitted isolated code-only SHA: $TARGET_SHA"

      - name: Prepare pinned OpenSSH identity
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]]
          (( PORT >= 1 && PORT <= 65535 ))
          expected="$HOST"
          if [[ "$PORT" != 22 ]]; then expected="[$HOST]:$PORT"; fi
          read -r host type key extra <<< "$HOST_KEY"
          [[ "$host" == "$expected" && -z "${extra:-}" && "$type" == ssh-ed25519 ]]
          umask 077
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/baogiang-known-hosts"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/baogiang-ssh-key"
          chmod 600 "$RUNNER_TEMP/baogiang-known-hosts" "$RUNNER_TEMP/baogiang-ssh-key"
          ssh-keygen -l -E sha256 -f "$RUNNER_TEMP/baogiang-known-hosts" >/dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/baogiang-ssh-key" >/dev/null

      - name: Deploy exact main commit using pinned OpenSSH
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          VPS_HOST: ${{ secrets.PROD_SSH_HOST }}
          VPS_PORT: ${{ secrets.PROD_SSH_PORT }}
          VPS_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VPS_USER" == bg_deploy ]]
          keyfile="$RUNNER_TEMP/baogiang-ssh-key"
          knownfile="$RUNNER_TEMP/baogiang-known-hosts"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          # Windows PowerShell writes CRLF. Preserve the SSH and tee exit codes
          # independently; a success marker never overrides transport failure.
          set +e
          ssh -n -i "$keyfile" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$knownfile" \
            "$VPS_USER@$VPS_HOST" \
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File 'C:\ProgramData\BaoGiangDeploy\request-deploy.ps1' -ExpectedSha "$TARGET_SHA" |
            tee "$RUNNER_TEMP/baogiang-deploy-result.txt"
          transport_status=( "${PIPESTATUS[@]}" )
          set -e
          if [[ "${transport_status[0]}" -ne 0 || "${transport_status[1]}" -ne 0 ]]; then
            echo "DEPLOY_TRANSPORT_FAILED ssh=${transport_status[0]} tee=${transport_status[1]}" >&2
            exit 1
          fi
          # Strip only a terminal CR on each line. Do not relax the SHA-bound
          # full-line match or interpret arbitrary worker text as success.
          sed 's/\r$//' "$RUNNER_TEMP/baogiang-deploy-result.txt" > "$RUNNER_TEMP/baogiang-deploy-normalized.txt"
          if ! grep -Eq "^(BAOGIANG_DEPLOY_VERIFIED sha=${TARGET_SHA} neighbor_pid=[0-9]+|BAOGIANG_DEPLOY_ALREADY_CURRENT sha=${TARGET_SHA})$" "$RUNNER_TEMP/baogiang-deploy-normalized.txt"; then
            echo "DEPLOY_EVIDENCE_INVALID: SSH succeeded without exact verified SHA evidence" >&2
            exit 1
          fi
          echo "DEPLOY_EVIDENCE_ACCEPTED sha=$TARGET_SHA"
