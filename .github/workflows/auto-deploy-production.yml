name: Auto deploy production after green CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-deploy-baogiang
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch isolated Bao Giang code-only release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical main HEAD and CI provenance
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          current_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo "Skipping superseded CI result; newer main commit exists."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          jq -e --arg sha "$TARGET_SHA" '
            .name == "CI" and .event == "push" and
            .head_branch == "main" and .head_sha == $sha and
            .status == "completed" and .conclusion == "success"
          ' <<< "$run" >/dev/null
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Read deployed BaoGiang release via pinned read-only SSH
        if: steps.gate.outputs.dispatch == 'true'
        id: predecessor
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
          PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.PROD_SSH_USER }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT >= 1 && PORT <= 65535 ))
          [[ "$VPS_USER" == 'bg_deploy' ]]
          [[ "$HOST_KEY" != *$'\n'* && "$HOST_KEY" != *$'\r'* ]]
          [[ "$HOST_KEY" != *'*'* && "$HOST_KEY" != *'?'* && "$HOST_KEY" != *'@cert-authority'* && "$HOST_KEY" != \|* ]]
          expected_host="$HOST"
          if [[ "$PORT" != '22' ]]; then expected_host="[$HOST]:$PORT"; fi
          read -r known_host known_type known_key known_extra <<< "$HOST_KEY"
          [[ "$known_host" == "$expected_host" && "$known_type" == 'ssh-ed25519' && -z "$known_extra" ]]
          [[ -n "$known_key" ]]
          printf '%s' "$known_key" | base64 --decode >/dev/null 2>&1
          umask 077
          keyfile="$RUNNER_TEMP/baogiang-auto-predecessor-key"
          knownfile="$RUNNER_TEMP/baogiang-auto-predecessor-host"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$keyfile"
          printf '%s\n' "$HOST_KEY" > "$knownfile"
          chmod 600 "$keyfile" "$knownfile"
          ssh-keygen -y -f "$keyfile" >/dev/null
          ssh-keygen -l -E sha256 -f "$knownfile" >/dev/null
          ps_code="$(cat <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $marker = Get-Content -LiteralPath 'C:\baogiang\shared\deployment-identity.json' -Raw | ConvertFrom-Json
          if ($marker.systemId -cne 'baogiang-damsan' -or $marker.canonicalRoot -cne 'C:\baogiang' -or $marker.apiPort -ne 3100) { throw 'WRONG_SYSTEM' }
          $pointer = Get-Item -LiteralPath 'C:\baogiang\current' -Force -ErrorAction Stop
          if ($pointer.LinkType -cne 'Junction') { throw 'UNVERIFIED_CURRENT_POINTER' }
          $target = [string](@($pointer.Target)[0])
          if ($target -cmatch '^C:\\baogiang\\releases\\([0-9a-f]{40})$') { $sha = $Matches[1] } else { throw 'WRONG_RELEASE_PATH' }
          Write-Output ('BAOGIANG_CURRENT_SHA=' + $sha)
          POWERSHELL
          )"
          encoded="$(printf '%s' "$ps_code" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          observed="$(timeout 45s ssh -n -i "$keyfile" -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$knownfile" "$VPS_USER@$HOST" \
            powershell.exe -NoProfile -NonInteractive -EncodedCommand "$encoded" | tr -d '\r')"
          [[ "$observed" =~ ^BAOGIANG_CURRENT_SHA=[0-9a-f]{40}$ ]] || { echo 'Deployed release proof malformed' >&2; exit 1; }
          echo "sha=${observed#BAOGIANG_CURRENT_SHA=}" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_DEPLOYED_SHA_VERIFIED'

      - name: Classify migration delta from actual deployed BaoGiang SHA
        if: steps.gate.outputs.dispatch == 'true'
        id: classification
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.predecessor.outputs.sha }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$DEPLOYED_SHA" == "$TARGET_SHA" ]]; then
            echo "mode=already-current" >> "$GITHUB_OUTPUT"
            echo "Release already deployed; no dispatch required."
            exit 0
          fi
          node scripts/ci/classify-production-migrations.cjs "$DEPLOYED_SHA" "$TARGET_SHA"

      - name: Dispatch according to reviewed migration policy
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_MODE: ${{ steps.classification.outputs.mode }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" == "$TARGET_SHA" ]] || { echo 'Superseded before dispatch; skip.'; exit 0; }
          case "$DEPLOY_MODE" in
            already-current)
              echo "BAOGIANG_ALREADY_DEPLOYED sha=$TARGET_SHA"
              ;;
            code-only)
              gh workflow run deploy-vps.yml --repo "$REPO" --ref main \
                -f "commit_sha=$TARGET_SHA" \
                -f "confirmation=DEPLOY-BAOGIANG-PRODUCTION" \
                -f "run_migrations=false" \
                -f "allow_code_rollback_after_migration=false"
              echo "BAOGIANG_CODE_ONLY_DISPATCHED sha=$TARGET_SHA"
              ;;
            approved-migration)
              start_utc="$(date -u -d '-2 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
              end_utc="$(date -u -d '+50 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
              gh workflow run deploy-production.yml --repo "$REPO" --ref main \
                -f "commit_sha=$TARGET_SHA" \
                -f "confirmation=DEPLOY-BAOGIANG-PRODUCTION" \
                -f "run_migrations=true" \
                -f "allow_code_rollback_after_migration=false" \
                -f "maintenance_window_start_utc=$start_utc" \
                -f "maintenance_window_end_utc=$end_utc" \
                -f "maintenance_operator=github-policy-approved"
              echo "BAOGIANG_REVIEWED_MIGRATION_DISPATCHED sha=$TARGET_SHA"
              ;;
            *) echo 'Unrecognized deployment mode; fail closed.' >&2; exit 1 ;;
          esac
